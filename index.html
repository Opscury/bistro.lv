    <link rel="preload" href="/fonts/bricolage-grotesque-latin-ext-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Silva — bistro, konditoreja, tējas namiņš un banketi Jelgavā</title>
    <meta name="description" content="Silva Jelgavā kopš 1994. gada: bistro un konditoreja Driksas ielā, tējas namiņš Pasta salā, banketi un telpu noma. Darba laiki, ēdienkartes un kontakti." />
    <meta property="og:site_name" content="Silva" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="lv_LV" />
    <meta property="og:title" content="Silva — bistro, konditoreja, tējas namiņš un banketi Jelgavā" />
    <meta property="og:description" content="Silva Jelgavā kopš 1994. gada: bistro un konditoreja Driksas ielā, tējas namiņš Pasta salā, banketi un telpu noma." />
    <meta property="og:image" content="https://bistro.lv/og/home.jpg" />
    <meta property="og:url" content="https://bistro.lv/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://bistro.lv/" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Redaktoru uzaicinājuma saites (Netlify Identity) nonāk uz sākumlapu:
         tikai tad ielādē pieteikšanās logu un aizved uz /admin/. -->
    <script>
      if (/(invite|recovery|confirmation)_token=/.test(location.hash)) {
        var s = document.createElement("script");
        s.src = "https://identity.netlify.com/v1/netlify-identity-widget.js";
        s.onload = function () {
          window.netlifyIdentity.on("init", function (u) {
            if (!u) window.netlifyIdentity.on("login", function () { location.href = "/admin/"; });
          });
        };
        document.head.appendChild(s);
      }
    </script>

    <!-- Netlify Forms atpazīst formas būvējot pēc šīm slēptajām kopijām.
         Lauku nosaukumi sakrīt ar lib/sendForm.js sūtītajiem. -->
    <form name="kontakti" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="text" name="phone" /><input type="email" name="email" />
      <textarea name="message"></textarea><input type="text" name="bot-field" />
    </form>
    <form name="banketi" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="text" name="phone" /><input type="email" name="email" />
      <input type="text" name="date" /><input type="text" name="guests" /><input type="text" name="type" />
      <input type="text" name="venue" /><textarea name="message"></textarea><input type="text" name="bot-field" />
    </form>
    <form name="pasutijums" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="text" name="phone" /><input type="email" name="email" />
      <input type="text" name="date" /><textarea name="message"></textarea><textarea name="order"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
