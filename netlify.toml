# Netlify: būve, pārrakstīšana un galvenes. Formas (Netlify Forms) ieslēdz
# ar VITE_NETLIFY_FORMS=true vides mainīgajā (Site settings → Environment).
#
# Pirms būves scripts/snapshot.mjs paņem jaunāko saturu no Silvas admin API
# (SNAPSHOT_API, noklusējums https://opscury.eu.pythonanywhere.com). Ja API
# nav pieejams, būve turpinās ar repozitorijā esošajiem src/data failiem.

[build]
  command = "npm run build"   # npm run build pats vispirms palaiž scripts/snapshot.mjs
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Formas (Kontakti, Konditoreja, Banketi) sūta uz Silvas admin API
  # (Django: saglabā "Pieteikumos" un nosūta e-pastu). Tukšs = mailto.
  VITE_FORM_ENDPOINT = "/api/enquiry/"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
